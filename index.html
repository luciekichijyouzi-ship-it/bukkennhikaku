<style>
:root{

  }
}
:root[data-theme="dark"]{
  --bg:#10161D; --surface:#18212B; --ink:#E8EDF2; --muted:#98A3B0; --line:#2A3542;
  --primary:#4FB3B9; --primary-ink:#0B1A1C;

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}

.shot .pick[hidden]{display:none}

.shot .msg{font-size:13px;margin-top:10px}
.shot .msg.err{color:var(--warn)}
.filled{background:color-mix(in srgb, var(--primary) 12%, var(--bg))}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.note{font-size:12.5px;color:var(--muted);white-space:pre-wrap}
.legend{font-size:12px;color:var(--muted);line-height:1.7}

venue": null, "appeal": 4, "busy": true, "commuteMin": 15, "floor": "2-5F", "floorLabel": "3F", "hpb": 5, "interior": null, "kind": "candidate", "lines": 4, "living": 3, "name": "TRES新宿 3F（新宿3-28-4）", "night": 5, "nightChecked": false, "note": "徒歩分数は仮の値。家賃比率9%に収めるには月商約1,670万円（1席185万円）が必要。指値の目安は115〜120万円", "rent": 150, "seats": 9, "station": "新宿駅東口", "tsubo": 35, "updatedAt": 3, "vacancy": 0, "walk": 3, "weekend": 5, "id": "c-tres-shinjuku"}, {"actualRevenue": 1400, "appeal": 5, "busy": true, "commuteMin": 25, "floor": "B", "floorLabel": "B1", "hpb": 5, "interior": null, "kind": "existing", "lines": 2, "living": 3, "name": "自由が丘（フィーノ自由が丘 B1）", "night": 4, "nightChecked": true, "note": "徒歩分数は仮の値（目安の7分）", "rent": 125, "seats": 14, "station": "自由が丘駅", "tsubo": 50, "updatedAt": 1, "vacancy": 0, "walk": 7, "weekend": 5, "id": "ex-jiyugaoka"}, {"actualRevenue": 1200, "appeal": 5, "busy": true, "commuteMin": 0, "floor": "2-5F", "floorLabel": "4F", "hpb": 5, "interior": null, "kind": "existing", "lines": 2, "living": 4, "name": "吉祥寺（テルキチジョウジ 4F）", "night": 4, "nightChecked": true, "note": "徒歩分数は仮の値（目安の7分）。月商はアベレージ1,200万円、MAX1,350万円（1席あたり169万円）", "rent": 70, "seats": 8, "station": "吉祥寺駅", "tsubo": 29, "updatedAt": 1, "vacancy": 0, "walk": 7, "weekend": 5, "id": "ex-kichijoji"}, {"actualRevenue": 1300, "appeal": 5, "busy": true, "commuteMin": 25, "floor": "B", "floorLabel": "B1", "hpb": 5, "interior": null, "kind": "existing", "lines": 3, "living": 2, "name": "表参道（SUN表参道 B1）", "night": 4, "nightChecked": true, "note": "徒歩分数は仮の値（目安の7分）。既存店で最短で月商1,000万円に到達", "rent": 121, "seats": 11, "station": "表参道駅", "tsubo": 40, "updatedAt": 1, "vacancy": 0, "walk": 7, "weekend": 5, "id": "ex-omotesando"}];

const DEFAULTS = {perSeat:117,low:100,high:144,labor:47,mat:8.5,other:17,hpb:110,interior:3500,equip:600,recruit:200,depositMonths:10,ramp:5,unitPrice:8000,days:26,tsuboPerSeat:3.6,crawlDays:3};

const esc = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function calc(p){
  const seats = p.seats || Math.max(1, Math.round(p.tsubo / S.tsuboPerSeat));
  const rev = p.actualRevenue || seats * S.perSeat;
  const tsuboPrice = p.rent / p.tsubo;
  const ratio = p.rent / rev * 100;
  const varRate = (S.labor + S.mat + S.other) / 100;
  const profit = rev * (1 - varRate) - S.hpb - p.rent;
  const interior = (p.interior ?? null) !== null ? p.interior : S.interior;
  const emptyRent = p.rent * (p.vacancy || 0);
  const invest = interior + S.equip + S.recruit + emptyRent;
  const deposit = p.rent * S.depositMonths;
  const payback = profit > 0 ? S.ramp + invest / profit : Infinity;
  const customers = rev * 10000 / S.unitPrice;
  const perSeatDay = customers / (seats * S.days);
  const walkLimit = p.busy ? 15 : 10;

  const sc = {};
  sc.ratio = ratio<=7?20:ratio<=9?17:ratio<=10?13:ratio<=12?6:0;
  sc.tsubo = tsuboPrice<=2.5?10:tsuboPrice<=3?9:tsuboPrice<=3.5?6:tsuboPrice<=4?3:0;
  sc.walk = p.busy ? (p.walk<=7?10:p.walk<=10?9:p.walk<=15?7:0) : (p.walk<=5?10:p.walk<=7?9:p.walk<=10?5:0);

  if (p.walk > walkLimit) flags.push(`徒歩${walkLimit}分超`);

  return {seats,rev,revLow:seats*S.low,revHigh:seats*S.high,tsuboPrice,ratio,profit,interior,emptyRent,invest,deposit,payback,customers,perSeatDay,walkLimit,sc,total,rank,flags};

    lines: L>=4?25:L===3?18:L===2?12:5,
    commute: M<=15?25:M<=30?18:M<=45?10:3,
    appeal: (p.appeal||3)*6,
    living: (p.living||3)*4
  };
  const total=Object.values(sc).reduce((a,b)=>a+b,0);
  return {sc,total,rank: total>=85?'S':total>=72?'A':total>=58?'B':'C'};
}

function parseText(t){
  t = String(t||'').replace(/[０-９．，]/g, c=>({'．':'.','，':','}[c] || String.fromCharCode(c.charCodeAt(0)-0xFEE0)));
  const num = x => Number(String(x).replace(/,/g,''));
  const d = {};
  let rent = null;
  const mY = t.match(/賃料[^0-9]{0,12}([0-9][0-9,]{3,})\s*円/) || t.match(/([0-9][0-9,]{5,})\s*円\s*\(?\s*税込/);
  const mM = t.match(/賃料[^0-9]{0,12}([0-9]+(?:\.[0-9]+)?)\s*万/) || t.match(/([0-9]+(?:\.[0-9]+)?)\s*万円/);
  if(mY) rent = num(mY[1])/10000;
  else if(mM) rent = num(mM[1]);
  const mK = t.match(/(?:管理費|共益費|管・?共)[^0-9]{0,12}([0-9][0-9,]{3,})\s*円/);
  if(rent!=null && mK) rent += num(mK[1])/10000;
  if(rent!=null) d.rent = Math.round(rent*10)/10;
  const mT = t.match(/([0-9]+(?:\.[0-9]+)?)\s*坪/);
  const mSq = t.match(/([0-9]+(?:\.[0-9]+)?)\s*(?:m2|m²|㎡)/i);
  if(mT) d.tsubo = num(mT[1]);
  else if(mSq) d.tsubo = Math.round(num(mSq[1])/3.3058*100)/100;
  const mW = t.match(/徒歩\s*([0-9]+)\s*分/);
  if(mW) d.walk = num(mW[1]);
  const mS = t.match(/([一-龥ぁ-んァ-ヶーA-Za-z0-9]{2,12})駅/);
  if(mS) d.station = mS[1] + '駅';
  const mF = t.match(/(地下\s*[0-9]?|B\s*[0-9]|[0-9]{1,2}\s*[FfＦ]|[0-9]{1,2}\s*階)/);
  if(mF){
    const raw = mF[1].replace(/\s/g,'');
    d.floorLabel = raw.replace(/階/,'F').replace(/^地下([0-9]?)$/,(m,n)=>'B'+(n||1)).toUpperCase();
    const n = Number((d.floorLabel.match(/[0-9]+/)||[0])[0]);
    d.floor = /^B|地下/.test(d.floorLabel) ? 'B' : n>=6 ? '6F+' : n===1 ? '1F' : '2-5F';
  }
  if(/スケルトン/.test(t)) d.type='スケルトン'; else if(/居抜/.test(t)) d.type='居抜き';
  d.name = [d.station, d.walk!=null?`徒歩${d.walk}分`:'', d.floorLabel||'', d.tsubo?d.tsubo+'坪':''].filter(Boolean).join(' ');
  return d;
}

async function shrinkImg(file){
  try{
    const bmp = await createImageBitmap(file);
    const k = Math.min(1, 2000/Math.max(bmp.width,bmp.height));
    const c = document.createElement('canvas'); c.width=Math.round(bmp.width*k); c.height=Math.round(bmp.height*k);
    const ctx=c.getContext('2d'); ctx.drawImage(bmp,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(b=>r(b||file),'image/png'));
  }catch(e){ return file; }
}

async function ocr(files, msg){
  if(!window.Tesseract) throw new Error('OCRライブラリを読み込めませんでした');
  let out='';
  for(let i=0;i<files.length;i++){
    const img = await shrinkImg(files[i]);
    const r = await Tesseract.recognize(img, 'jpn+eng', {
      logger: m => { if(m.status==='recognizing text') msg.textContent = `文字を読み取り中…（${i+1}/${files.length}・${Math.round((m.progress||0)*100)}%）`; }
    });
    out += (r && r.data && r.data.text || '') + '\n';
  }
  return out;
}

async function readShot(){
  const input = $('#shotfile'), btn = $('#shotbtn'), msg = $('#shotmsg');
  const files = Array.from((input&&input.files)||[]);
  const text = ($('#shottext').value||'').trim();
  if(!files.length && !text){ msg.className='msg err'; msg.textContent='スクショを選ぶか、文章を貼り付けてください。'; return; }
  msg.className='msg'; msg.textContent = files.length ? '読み取りの準備をしています…（初回は辞書の読み込みに30秒ほどかかります）' : '読み取っています…';
  if(btn) btn.disabled = true;
  try{
    const raw = files.length ? await ocr(files, msg) : text;
    const d = parseText(raw + '\n' + text);
    const f = $('#f');
    const set = (k,v)=>{ if(v===null||v===undefined||v==='') return false; const el=f.elements[k]; if(!el) return false; el.value=v; el.classList.add('filled'); return true; };
    let n=0;
    n+=set('name', d.name); n+=set('station', d.station);
    n+=set('rent', d.rent); n+=set('tsubo', d.tsubo); n+=set('walk', d.walk);
    n+=set('floorLabel', d.floorLabel); if(d.floor) n+=set('floor', d.floor);
    const note = ['スクショ・文章から自動入力', d.type||''].filter(Boolean).join('。');
    n+=set('note', note);
    const miss=[]; if(d.rent==null)miss.push('賃料'); if(d.tsubo==null)miss.push('坪数'); if(d.walk==null)miss.push('駅徒歩');
    msg.className = miss.length ? 'msg err' : 'msg';
    msg.textContent = n ? `${n}項目を入力しました。${miss.length?'読み取れなかった項目：'+miss.join('・')+'。':''}夜・週末・HPB・採用の各項目を選んでから保存してください。` : '物件情報を読み取れませんでした。手入力で登録してください。';
    f.scrollIntoView({behavior:'smooth', block:'start'});
  }catch(e){
    msg.className='msg err'; msg.textContent = '読み取りに失敗しました（' + (e&&e.message||'error') + '）。文章を貼り付けるか、手入力で登録してください。';
  }finally{ if(btn) btn.disabled=false; }
}

function setTabs(){ document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-selected', String(b.dataset.tab===tab))); }
function render(){ setTabs(); if(tab==='list'){ selected?renderDetail():renderList(); } else if(tab==='form'){ renderForm(); } else if(tab==='areas'){ renderAreas(); } else renderSettings(); }

const TIERS = {hot:['激戦区','新着はサイト通知で社長に直送。Claudeは巡回しない'],normal:['通常エリア','Claudeが定期巡回して採点し、A以上だけ通知'],off:['除外','巡回も通知もしない']};
function renderAreas(){
  const group = t => areas.filter(a=>a.tier===t).sort((a,b)=>(a.name||'').localeCompare(b.name||'','ja'));
  const card = a => `
    <div class="panel" style="padding:12px 14px;margin-bottom:8px">
      <div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start">
        <div><div style="font-weight:700">${esc(a.name)}</div>
          <div class="meta" style="font-size:12.5px;color:var(--muted)">${a.tier==='off'?'対象外':`${fmt(a.minTsubo)}〜${fmt(a.maxTsubo)}坪 ・ 月額${fmt(a.maxRent)}万円以下`}</div>
          ${a.note?`<div class="note" style="margin-top:2px">${esc(a.note)}</div>`:''}</div>
        <div style="display:flex;gap:6px;flex:none"><button class="btn ghost" style="padding:6px 10px" data-ea="${esc(a.id)}">編集</button></div>
      </div>
    </div>`;
  const a = editingArea ? areas.find(x=>x.id===editingArea) : {tier:'normal',minTsubo:30,maxTsubo:50,maxRent:120};
  const v = k => a[k]==null?'':esc(a[k]);
  $('#view').innerHTML = `
    <div class="panel legend" style="margin-bottom:14px">
      この一覧は、物件を読み取ったときに対象エリアを判定するために使います。
    </div>
    ${['hot','normal','off'].map(t=>`<div class="group-title">${TIERS[t][0]}<span style="font-weight:400"> ・ ${TIERS[t][1]}</span></div>${group(t).map(card).join('')||'<div class="empty" style="padding:10px">まだありません</div>'}`).join('')}
    <form class="panel" id="af" style="margin-top:18px">
      <h3>${editingArea?'エリアを編集':'エリアを追加'}</h3>
      <div class="grid">
        <label class="full">エリア名<input name="name" required value="${v('name')}" placeholder="例：高田馬場駅 徒歩7分以内"></label>
        <label>区分<select name="tier">${Object.entries(TIERS).map(([k,[l]])=>`<option value="${k}"${a.tier===k?' selected':''}>${l}</option>`).join('')}</select></label>
        <label>月額の上限（万円）<input name="maxRent" type="number" min="0" value="${v('maxRent')}"></label>
        <label>坪数（下限）<input name="minTsubo" type="number" min="0" value="${v('minTsubo')}"></label>
        <label>坪数（上限）<input name="maxTsubo" type="number" min="0" value="${v('maxTsubo')}"></label>
        <label class="full">Claudeへの要望<textarea name="note" placeholder="例：早稲田通り沿いを優先。地下は除外">${v('note')}</textarea></label>
      </div>
      <div class="actions"><button class="btn primary" type="submit">${editingArea?'変更を保存':'エリアを追加'}</button>
      ${editingArea?'<button class="btn ghost" type="button" id="acancel">キャンセル</button><button class="btn danger" type="button" id="adel">削除する</button>':''}</div>
    </form>`;
  document.querySelectorAll('[data-ea]').forEach(b=>b.onclick=()=>{editingArea=b.dataset.ea;renderAreas();$('#af').scrollIntoView({behavior:'smooth'});});
  if(editingArea){
    $('#acancel').onclick=()=>{editingArea=null;renderAreas();};
    $('#adel').onclick=async()=>{ const x=areas.find(y=>y.id===editingArea); if(!confirm(`「${x.name}」を削除しますか？`))return; await removeArea(editingArea); editingArea=null; renderAreas(); };
  }
  $('#af').onsubmit=async e=>{
    e.preventDefault(); const fd=new FormData(e.target);
    const d={name:fd.get('name').trim(),tier:fd.get('tier'),maxRent:num(fd.get('maxRent')),minTsubo:num(fd.get('minTsubo')),maxTsubo:num(fd.get('maxTsubo')),note:fd.get('note').trim(),updatedAt:Date.now()};
    const id = editingArea || ('a'+Date.now().toString(36)+Math.random().toString(36).slice(2,6));
    await saveArea(id,d); editingArea=null; renderAreas(); setStatus('探索エリアを保存しました');
  };
}
async function saveArea(id,d){
  const i=areas.findIndex(a=>a.id===id); if(i>=0) areas[i]={...d,id}; else areas.push({...d,id});
  if(mode==='db'){ try{ await db.collection('areas').doc(id).set(d); }catch(e){ setStatus('保存できませんでした'); } } else lsSet('areas',areas);
}
async function removeArea(id){
  areas=areas.filter(a=>a.id!==id);
  if(mode==='db'){ try{ await db.collection('areas').doc(id).delete(); }catch(e){ setStatus('削除できませんでした'); } } else lsSet('areas',areas);
}
function setStatus(t){ $('#status').textContent=t; }
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{ tab=b.dataset.tab; editingArea=null; if(tab!=='form')editing=null; if(tab==='list')selected=null; render(); });

// ---- storage ----
function lsGet(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

async function saveProp(id, d){
  const i = props.findIndex(p=>p.id===id);
  if(i>=0) props[i]={...d,id}; else props.push({...d,id});
  if(mode==='db'){ try{ await db.collection('properties').doc(id).set(d); }catch(e){ setStatus('保存できませんでした：'+(e&&e.code||'error')); } }
  else lsSet('props', props);
}
async function removeProp(id){
  props = props.filter(p=>p.id!==id);
  if(mode==='db'){ try{ await db.collection('properties').doc(id).delete(); }catch(e){ setStatus('削除できませんでした'); } }
  else lsSet('props', props);
}
async function saveSettings(n){
  S = {...DEFAULTS, ...n};
  if(mode==='db'){ try{ await db.doc('settings/main').set(S); }catch(e){ setStatus('前提条件を保存できませんでした'); } }
  else lsSet('settings', S);
}

(async function init(){
  S = {...DEFAULTS, ...(lsGet('settings')||{})};
  props = lsGet('props') || SEED_PROPS.map(p=>({...p}));
  areas = lsGet('areas') || SEED_AREAS.map(a=>({...a}));
  if(!lsGet('props')) lsSet('props', props);
  if(!lsGet('areas')) lsSet('areas', areas);
  render();
  setStatus('この端末に保存されます。他の端末やスタッフと共有するには「前提」タブから書き出し／読み込みを使ってください');
})();
</script>
